#:schema ./.xenomorph/xenomorph.schema.json

[parser]
entry = "./tests/examples/test"

[formatter]
indent_kind = "space"
indent_width = 4
max_line_length = 100
line_ending = "lf"

[debug]
loglevel = "info"
# tokens = true
# ast = true
# plugins = true

[plugins]
path = "./target/release/"
plugins = ["xenomorph_json_schema", "xenomorph_java", "xenomorph_typescript"]

[plugins.typescript]
output = "./tests/out/typescript/"

[plugins.json_schema]
output = "./tests/out/json_schema/"

[plugins.java]
output = "./tests/out/java/"
package = "com.xyz.model"
data = true
builder = true
