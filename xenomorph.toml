#:schema ./schema/tda/.xenomorph/xenomorph.schema.json

extends = "./schema/tda/xenomorph.toml"

[parser]
# entry = "schema/tda/index"
# entry = "schema/tda/backend"
entry = "schema/tda/ai"
# entry = "schema/tda/ui"

[plugins]
path = "./target/release/"
plugins = [
    "xenomorph_json_schema",
    "xenomorph_java",
    "xenomorph_typescript",
    "xenomorph_pydantic",
]
# plugins = ["xenomorph_java"]
# plugins = ["xenomorph_typescript"]
# plugins = ["xenomorph_pydantic"]
# plugins = ["xenomorph_json_schema"]

[plugins.typescript]
output = "./tests/out/typescript/"

[plugins.json_schema]
output = "./tests/out/json_schema/"

[plugins.java]
output = "./tests/out/java/"
package = "jet.schema"
data = true
builder = true

[plugins.pydantic]
output = "./tests/out/pydantic/"
