name: Linting

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    push:
        branches: ["**"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: linting-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: Rust formatting and Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Install workspace toolchain
              run: rustup show active-toolchain
            - uses: Swatinem/rust-cache@v2
            - name: Check formatting
              run: cargo fmt --all -- --check
            - name: Lint workspace
              run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

    extension:
        name: VS Code extension type checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: 12.11.2
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: pnpm
                  cache-dependency-path: extensions/vscode/client/pnpm-lock.yaml
            - name: Install extension dependencies
              run: pnpm --dir extensions/vscode/client install --frozen-lockfile
            - name: Check types
              run: pnpm --dir extensions/vscode/client run typecheck
