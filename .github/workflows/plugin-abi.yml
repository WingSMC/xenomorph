name: Plugin ABI and lifecycle

on:
  push:
  pull_request:

jobs:
  plugin-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and components
        shell: bash
        run: |
          rustup toolchain install nightly-2026-03-03 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.94.0 --profile minimal
      - name: Build independent plugin binaries
        shell: bash
        run: |
          cargo build --workspace --locked
          cargo +1.94.0 build -p xenomorph_test_plugin --locked --features alternate-version --target-dir target/plugin-fixture-stable
          cargo build -p xenomorph_test_plugin --locked --features bad-abi --target-dir target/plugin-fixture-bad
      - name: Check ABI, lifecycle, and regressions
        shell: bash
        run: |
          cargo test --workspace --locked
          cargo test -p xenomorph_common plugins::tests --locked -- --ignored
          cargo test -p xenomorph_lsp --test reload --locked -- --ignored
          cargo test -p xenomorph_parser --test plugin_cli --locked -- --ignored
          cargo fmt --all -- --check
